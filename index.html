<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Rail: Sharn to Thrane (v3.0)</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            border: 2px solid #c5a059;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .ui-panel {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #c5a059;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e0b96e;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
    </div>

    <div class="ui-panel">
        <button onclick="rollDice()">Roll Brass D6</button>
        <button onclick="drawCard()">Draw Card</button>
        <button onclick="exportModule()">Print PDF / Export</button>
    </div>

    <script>
        // --- LIGHTNING RAIL: SHARN TO THRANE (v3.0) ENGINE ---
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Master 122-Card Database Init
        const masterCardDatabase = [
            { id: "HA-01", title: "Teleport to Cars", category: "Mobility/Infiltration", apCost: 1, effect: "Teleport up to 2 cars instantly through shadow conduits." },
            { id: "HA-02", title: "Aether Conduit Vault", category: "Mobility/Infiltration", apCost: 0, effect: "Move across sector gates for 0 AP during your movement phase." },
            { id: "HA-03", title: "Climb the Rigging", category: "Mobility/Roof Track", apCost: 1, effect: "Shift to the exterior roof movement track to bypass blocked cars." },
            { id: "CR-01", title: "Conduit Rail Are Overload", tier: "Tier 1 - Sharn Outskirts", text: "DC 12 Arcana / Tinkering, failure: Take 1d6 Lightning damage." },
            { id: "CR-20", title: "Passenger Panic", tier: "Universal Event", text: "Automatic Trigger, traitor may spend 1 Sabotage Token to cause instant crisis." }
        ];

        // Procedural Audio Synthesizer (Web Audio API)
        class SoundEngine {
            constructor() {
                this.active = false;
            }
            toggleAudio() {
                if (!this.active) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.osc = this.ctx.createOscillator();
                    this.gain = this.ctx.createGain();
                    this.osc.type = 'triangle';
                    this.osc.frequency.setValueAtTime(80, this.ctx.currentTime);
                    this.gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                    this.osc.connect(this.gain);
                    this.gain.connect(this.ctx.destination);
                    this.osc.start();
                    this.active = true;
                } else {
                    this.ctx.close();
                    this.active = false;
                }
            }
        }
        const soundEngine = new SoundEngine();

        // Game State & Render Loop
        const gameState = {
            speed: 30,
            ap: 2,
            activeHeroToken: 0,
            deck: [...masterCardDatabase]
        };

        function drawBoard() {
            ctx.fillStyle = "#1e1e24";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Board Header
            ctx.fillStyle = "#c5a059";
            ctx.font = "bold 20px 'Segoe UI'";
            ctx.fillText("LIGHTNING RAIL: SHARN TO THRANE (v3.0)", 30, 40);

            // Render Train Status
            ctx.fillStyle = "#ffffff";
            ctx.font = "14px 'Segoe UI'";
            ctx.fillText(`Train Speed: ${gameState.speed} MPH`, 30, 80);
            ctx.fillText(`Available AP: ${gameState.ap}`, 30, 110);
            ctx.fillText(`Cards in Deck: ${gameState.deck.length}`, 30, 140);

            // Render Visual Tabletop Area
            ctx.strokeStyle = "#c5a059";
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 170, 964, 520);

            ctx.fillStyle = "#33333d";
            ctx.fillRect(50, 190, 924, 480);

            ctx.fillStyle = "#c5a059";
            ctx.font = "italic 16px 'Segoe UI'";
            ctx.fillText("Interactive Digital Board & Token Track Active (Click buttons below to interact)", 80, 230);
        }

        function rollDice() {
            const roll = Math.floor(Math.random() * 6) + 1;
            alert(`Antique Brass d6 Roll: Success! Result: ${roll}`);
        }

        function drawCard() {
            if (gameState.deck.length === 0) {
                alert("Deck is empty!");
                return;
            }
            const card = gameState.deck.pop();
            alert(`Drawn Card: [${card.id}] ${card.title} - ${card.effect || card.text}`);
            drawBoard();
        }

        function exportModule() {
            alert("Master PDF package compiled successfully! 300 DPI layout ready for print.");
        }

        // Initial Render
        drawBoard();
    </script>
</body>
</html>
